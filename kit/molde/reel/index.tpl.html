<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITULO}}</title>
    <!-- Gerado pelo estúdio (./estudio montar) a partir de kit/molde/reel. Não edite à mão: mude a tabela de cenas e monte de novo. -->
    <script src="assets/gsap.min.js"></script>
{{PLUGINS}}
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920" data-fps="30">
      <div id="cam">
        <div id="zoom">
          <video id="take" class="clip" src="assets/take.mp4" data-start="0" data-duration="{{DURACAO}}" data-track-index="0" data-has-audio="true" playsinline></video>
          <div id="sombra-rosto"></div>
        </div>
      </div>

      <div id="faixa" class="clip" data-start="0" data-duration="{{DURACAO}}" data-track-index="1" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap></div>
      <div id="costura" data-layout-ignore></div>

      <div id="gancho" class="clip" data-start="0" data-duration="{{GANCHO_FIM}}" data-track-index="2" data-track-kind="graphics" data-layout-allow-overlap>
        {{GANCHO}}
      </div>

      <div id="telas" class="clip" data-start="0" data-duration="{{DURACAO}}" data-track-index="3" data-track-kind="graphics" data-layout-allow-overlap data-layout-allow-overflow>
        {{TELAS}}
      </div>

      <div id="midias">
        {{MIDIAS}}
      </div>

      {{CTA}}

      <div id="capshost" class="clip" data-start="0" data-duration="{{DURACAO}}" data-track-index="6" data-track-kind="captions" data-layout-allow-overlap>
        <div id="caps">
{{LEGENDAS}}
        </div>
      </div>

{{SONS}}
    </div>

    <script id="dados-reel" type="application/json">{{DADOS}}</script>
    <script src="animacao.js"></script>
  </body>
</html>
